name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11']

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verify package imports
        run: |
          python -c "from portfolio.optimize_mpt import MPTOptimizer; from simulations.trading_sim import TradingSimulator; print('package imports OK')"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=portfolio --cov=simulations --cov-report=term-missing --cov-report=xml

      - name: Compile shipped application modules
        run: |
          python -m py_compile app/main.py app/pages/simulations.py app/pages/portfolio_review.py simulations/trading_sim.py portfolio/optimize_mpt.py core/data_ingestion.py backtesting/engine.py models/monte_carlo.py

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
